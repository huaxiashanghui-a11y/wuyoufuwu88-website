<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 数据库检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .test-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .test-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result.error {
            background: #fee;
            color: #c00;
        }

        .result.success {
            background: #efe;
            color: #0c0;
        }

        .btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .summary {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .summary-title {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .summary-content {
            text-align: center;
            font-size: 18px;
            line-height: 2;
        }

        .summary-content.success {
            color: #155724;
        }

        .summary-content.error {
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Supabase 数据库检测</h1>

        <div class="test-section">
            <div class="test-header">
                <div class="test-title">📂 检测分类表 (categories)</div>
                <div class="status pending" id="categoriesStatus">检测中...</div>
            </div>
            <div class="result" id="categoriesResult"></div>
        </div>

        <div class="test-section">
            <div class="test-header">
                <div class="test-title">📦 检测商品表 (products)</div>
                <div class="status pending" id="productsStatus">检测中...</div>
            </div>
            <div class="result" id="productsResult"></div>
        </div>

        <div class="test-section">
            <div class="test-header">
                <div class="test-title">💰 检测价格表 (product_prices)</div>
                <div class="status pending" id="pricesStatus">检测中...</div>
            </div>
            <div class="result" id="pricesResult"></div>
        </div>

        <div class="test-section">
            <div class="test-header">
                <div class="test-title">🖼️ 检测轮播图表 (banners)</div>
                <div class="status pending" id="bannersStatus">检测中...</div>
            </div>
            <div class="result" id="bannersResult"></div>
        </div>

        <div class="test-section">
            <div class="test-header">
                <div class="test-title">⚙️ 检测配置表 (settings)</div>
                <div class="status pending" id="settingsStatus">检测中...</div>
            </div>
            <div class="result" id="settingsResult"></div>
        </div>

        <div class="summary">
            <div class="summary-title">📊 检测结果汇总</div>
            <div class="summary-content" id="summary">正在检测...</div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="location.reload()">重新检测</button>
                <button class="btn" onclick="window.open('admin.html', '_blank')" style="margin-left: 10px;">打开管理后台</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ufxglsigclmqovqbfzad.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_e03LbnJ7Gs4flKRK8zqubA_KkT6CfZX';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const results = {
            categories: false,
            products: false,
            prices: false,
            banners: false,
            settings: false
        };

        async function testTable(tableName) {
            try {
                const { data, error } = await supabase
                    .from(tableName)
                    .select('*')
                    .limit(5);

                if (error) {
                    return { success: false, error: error.message };
                }

                return { success: true, data: data };
            } catch (e) {
                return { success: false, error: e.message };
            }
        }

        async function testCategories() {
            const result = await testTable('categories');
            const statusEl = document.getElementById('categoriesStatus');
            const resultEl = document.getElementById('categoriesResult');

            if (result.success) {
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 正常';
                resultEl.className = 'result success';
                resultEl.innerHTML = `✅ 表创建成功<br>初始数据数量: ${result.data.length}<br><br>数据预览:<br>${JSON.stringify(result.data, null, 2)}`;
                results.categories = true;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.className = 'result error';
                resultEl.textContent = `❌ 错误: ${result.error}`;
            }
        }

        async function testProducts() {
            const result = await testTable('products');
            const statusEl = document.getElementById('productsStatus');
            const resultEl = document.getElementById('productsResult');

            if (result.success) {
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 正常';
                resultEl.className = 'result success';
                resultEl.innerHTML = `✅ 表创建成功<br>商品数量: ${result.data.length}<br><br>数据预览:<br>${JSON.stringify(result.data, null, 2)}`;
                results.products = true;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.className = 'result error';
                resultEl.textContent = `❌ 错误: ${result.error}`;
            }
        }

        async function testPrices() {
            const result = await testTable('product_prices');
            const statusEl = document.getElementById('pricesStatus');
            const resultEl = document.getElementById('pricesResult');

            if (result.success) {
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 正常';
                resultEl.className = 'result success';
                resultEl.innerHTML = `✅ 表创建成功<br>价格数量: ${result.data.length}<br><br>数据预览:<br>${JSON.stringify(result.data, null, 2)}`;
                results.prices = true;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.className = 'result error';
                resultEl.textContent = `❌ 错误: ${result.error}`;
            }
        }

        async function testBanners() {
            const result = await testTable('banners');
            const statusEl = document.getElementById('bannersStatus');
            const resultEl = document.getElementById('bannersResult');

            if (result.success) {
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 正常';
                resultEl.className = 'result success';
                resultEl.innerHTML = `✅ 表创建成功<br>轮播图数量: ${result.data.length}<br><br>数据预览:<br>${JSON.stringify(result.data, null, 2)}`;
                results.banners = true;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.className = 'result error';
                resultEl.textContent = `❌ 错误: ${result.error}`;
            }
        }

        async function testSettings() {
            const result = await testTable('settings');
            const statusEl = document.getElementById('settingsStatus');
            const resultEl = document.getElementById('settingsResult');

            if (result.success) {
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 正常';
                resultEl.className = 'result success';
                resultEl.innerHTML = `✅ 表创建成功<br>配置数量: ${result.data.length}<br><br>数据预览:<br>${JSON.stringify(result.data, null, 2)}`;
                results.settings = true;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ 失败';
                resultEl.className = 'result error';
                resultEl.textContent = `❌ 错误: ${result.error}`;
            }
        }

        function updateSummary() {
            const allPassed = Object.values(results).every(r => r === true);
            const summaryEl = document.getElementById('summary');

            if (allPassed) {
                summaryEl.className = 'summary-content success';
                summaryEl.innerHTML = `
                    🎉 恭喜！所有表都创建成功！<br>
                    ✅ 数据库初始化完成<br>
                    ✅ 可以开始使用管理后台<br>
                    <br>
                    <a href="admin.html" target="_blank" style="color: #667eea; text-decoration: underline; font-weight: bold;">点击打开管理后台</a>
                `;
            } else {
                summaryEl.className = 'summary-content error';
                summaryEl.innerHTML = `
                    ⚠️ 检测到部分表创建失败<br>
                    请检查错误信息，确认 SQL 脚本是否正确执行<br>
                    <br>
                    失败的表：<br>
                    ${!results.categories ? '❌ categories<br>' : ''}
                    ${!results.products ? '❌ products<br>' : ''}
                    ${!results.prices ? '❌ product_prices<br>' : ''}
                    ${!results.banners ? '❌ banners<br>' : ''}
                    ${!results.settings ? '❌ settings<br>' : ''}
                `;
            }
        }

        async function runAllTests() {
            await Promise.all([
                testCategories(),
                testProducts(),
                testPrices(),
                testBanners(),
                testSettings()
            ]);
            updateSummary();
        }

        runAllTests();
    </script>
</body>
</html>
